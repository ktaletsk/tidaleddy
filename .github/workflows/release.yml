# Publish tidaleddy to PyPI with trusted publishing (no API tokens).
#
#   Publish a GitHub release tagged v<version>          → uploads to PyPI
#   Run it by hand (Actions → release → Run workflow)  → uploads where you choose:
#                                                        TestPyPI (default) or PyPI
#
# One-time setup on https://pypi.org: Account → Publishing → Add a pending publisher →
# owner "ktaletsk", repository "tidaleddy", workflow "release.yml", environment "pypi".
# TestPyPI is optional: only hand runs aimed at it need the same publisher on
# https://test.pypi.org, with environment "testpypi".
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --locked --extra marimo --group dev

      - name: Test
        run: uv run --no-sync pytest -q

      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match the version in pyproject.toml ($version)"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the package
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tidaleddy/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # TestPyPI is for trying things: re-running the same version is fine

  pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tidaleddy/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
